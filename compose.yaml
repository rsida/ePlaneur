# Services shared by every environment.
#  - Dev:  compose.yaml + compose.override.yaml (loaded automatically)
#  - Prod: compose.yaml + compose.prod.yaml
# Always go through the Makefile: it feeds the same .env files as Symfony to Compose.
name: ${COMPOSE_PROJECT_NAME:-eplaneur}

x-database-env: &database-env
  DATABASE_HOST: database
  DATABASE_PORT: 3306
  MARIADB_VERSION: ${MARIADB_VERSION:?}
  MARIADB_DATABASE: ${MARIADB_DATABASE:?}
  MARIADB_USER: ${MARIADB_USER:?}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    restart: unless-stopped
    environment:
      <<: *database-env
    depends_on:
      database:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    depends_on:
      - php

###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:${MARIADB_VERSION:?}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?}
      MARIADB_USER: ${MARIADB_USER:?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
