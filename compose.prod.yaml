# Production and staging: docker compose -f compose.yaml -f compose.prod.yaml, plus
#  - compose.traefik.yaml: a Traefik of its own on ports 80/443 (default), or
#  - compose.traefik-external.yaml: the Traefik already running on the server (TRAEFIK_NETWORK set).
# Use `make deploy-prod TAG=vX.Y.Z` rather than calling these files directly.

x-php-prod: &php-prod
  image: ${COMPOSE_PROJECT_NAME:-eplaneur}-php:${APP_VERSION:-latest}
  restart: unless-stopped
  environment:
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in .env.local}
    DEFAULT_URI: https://${SERVER_NAME:?}
    MAILER_DSN: ${MAILER_DSN:?}
    MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:?}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:?}
    SEARCH_ENGINES_ALLOWED: ${SEARCH_ENGINES_ALLOWED:-1}
    DATABASE_HOST: database
    DATABASE_PORT: 3306
    MARIADB_VERSION: ${MARIADB_VERSION:?}
    MARIADB_DATABASE: ${MARIADB_DATABASE:?}
    MARIADB_USER: ${MARIADB_USER:?}
    MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}
  volumes:
    # Uploaded media (images, PDF...): must survive deployments, back it up with the database
    - uploads:/app/var/uploads
    # Flight tracks of the flight viewer: same rules
    - flights:/app/var/flights
  depends_on:
    database:
      condition: service_healthy

services:
  php:
    <<: *php-prod
    build:
      target: php_prod
    networks:
      default:
        # Name nginx reaches PHP by: unique, as nginx may share a network with other projects
        aliases:
          - ${COMPOSE_PROJECT_NAME:-eplaneur}-php

  worker:
    <<: *php-prod
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    user: www-data
    # Same image as the php service, which builds it
    pull_policy: never

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx_prod
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.28}
    image: ${COMPOSE_PROJECT_NAME:-eplaneur}-nginx:${APP_VERSION:-latest}
    environment:
      PHP_FPM_HOST: ${COMPOSE_PROJECT_NAME:-eplaneur}-php
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-eplaneur}.rule=Host(`${SERVER_NAME:?}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-eplaneur}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-eplaneur}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-eplaneur}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-eplaneur}.loadbalancer.server.port=80

volumes:
  uploads:
  flights:
