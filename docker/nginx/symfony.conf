# Shared Symfony front-controller rules, included by dev and prod server blocks.
root /app/public;
client_max_body_size 20M;

location / {
    try_files $uri /index.php$is_args$args;
}

location ~ ^/index\.php(/|$) {
    # Resolve "php" at request time through Docker's DNS, so nginx starts
    # even when the php container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;
    fastcgi_pass $php_upstream;

    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_buffer_size 128k;
    fastcgi_buffers 4 256k;
    internal;
}

# Never expose other PHP files
location ~ \.php$ {
    return 404;
}
