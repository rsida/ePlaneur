        answer: 1
        explanation: "Au-dessus de l'altitude de transition, tous les aéronefs calent 1013 hPa et volent en niveaux de vol : ils ont tous la même référence."
      - question: "Pourquoi augmente-t-on la vitesse d'approche par vent fort et turbulent ?"
        choices: ["Pour se poser plus loin", "Pour gagner du temps", "Pour garder une marge contre le gradient de vent et les rafales"]
        answer: 3
        explanation: "Le vent faiblit près du sol et les rafales font varier la vitesse air : une marge de vitesse protège du décrochage en finale."
      - question: "Quel facteur humain fait prendre de mauvaises décisions en fin de longue course ?"
        choices: ["Un calage MacCready trop bas", "La fatigue et la déshydratation", "Le soleil dans le dos"]
        answer: 2
