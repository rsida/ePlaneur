      - question: "En virage à 60° d'inclinaison, le facteur de charge vaut…"
        choices: ["1", "2", "4"]
        answer: 2
        explanation: "n = 1 / cos(60°) = 2. La vitesse de décrochage est alors multipliée par √2, soit environ 1,4."
      - question: "Dans l'atmosphère standard, quelle est la température au niveau de la mer ?"
        choices: ["0 °C", "15 °C", "20 °C"]
        answer: 2
