      - question: "Température 25 °C, point de rosée 13 °C au sol. Où se trouve environ la base des cumulus ?"
        choices: ["Vers 500 m", "Vers 1 500 m au-dessus du sol", "Vers 4 000 m"]
        answer: 2
        explanation: "Base ≈ 125 m × (température − point de rosée) = 125 × 12 = 1 500 m au-dessus du sol."
      - question: "Quelle est la règle de priorité entre deux aéronefs dont les routes se croisent à la même altitude ?"
        choices: ["Le plus rapide passe", "Celui qui voit l'autre à sa droite lui laisse le passage", "Celui qui est à gauche a la priorité"]
        answer: 2
        explanation: "On cède le passage à l'aéronef qui vient de droite (entre aéronefs de même catégorie)."
      - question: "Un planeur peut-il voler en VFR dans un espace aérien de classe A ?"
