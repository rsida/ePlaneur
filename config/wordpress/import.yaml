# Visibility of the content the public API hides ("Contenu restreint"): the groups allowed to read it.
restricted_groups: [committee]

# Lead (chapô) of the pages WordPress gives none, by path of the new site: their description for
# search engines and their line in llms.txt. A lead written in WordPress or in the back-office wins.
leads:
    formation: 'Un parcours en huit étapes, des vidéos et des guides pour apprendre le vol en planeur virtuel sur le simulateur Condor, du premier vol au vol en réseau.'
    formation/bien-demarrer: 'Installer Condor et trouver de l’aide auprès des ChatBots ePlaneur pour faire ses premiers vols sur simulateur, sans connaissance technique préalable.'
    formation/bien-demarrer/chatbots: 'Les assistants d’intelligence artificielle du Club répondent en langage naturel aux questions sur ePlaneur, Condor et le fonctionnement du club.'
    formation/bien-demarrer/installer-condor: 'Choisir son équipement, installer et configurer le simulateur Condor pour voler en planeur virtuel avec d’autres pilotes, et trouver de l’aide en cas de difficulté.'
    formation/bonnes-pratiques: 'Voler sans méthode n’apprend pas à piloter : ce qui distingue un ePilote d’un joueur, et comment éviter le piège du gaming dans la formation sur Condor.'
    formation/decouvrir: 'Ce qu’est ePlaneur, comment il fonctionne et les ressources pour débuter le pilotage d’un planeur sur ordinateur, sans connaissance aéronautique préalable.'
    formation/decouvrir/eplaneur: 'Le ePlaneur est le vol en planeur sur le simulateur Condor : aérologie et performances réalistes, mêmes principes et même progression que le vol réel.'
    formation/decouvrir/site-club: 'Le site du Club ePlaneur, point central d’une association sans lieu physique : formation, vols en réseau, adhésions et vie du club, entièrement à distance.'
    formation/decouvrir/site-eplaneur-fr: 'ePlaneur.fr, le site fondateur, rassemble les plans de vol, les sessions, les ressources Condor et les vidéos ; le site du Club porte la vie de l’association.'
    formation/parcours-guide: 'Huit étapes, trois d’Initiation et cinq de niveau Standard, pour passer de la découverte de Condor à une pratique autonome du vol en planeur virtuel.'
    formation/parcours-guide/etape-1: 'Première étape de la formation ePlaneur : découvrir Condor et les gestes de base du pilotage d’un planeur par des exercices simples.'
    formation/suivi-parcours: 'Situer l’avancement d’un pilote dans les étapes de la formation ePlaneur. Le dispositif est en cours de réflexion au Comité Directeur.'
    formation/videos-pedagogiques: 'Les vidéos de la formation ePlaneur, dans l’ordre du parcours en huit étapes : phases du vol, procédures et notions de pilotage sur Condor.'
    formation/vue-ensemble: 'Un cadre progressif plutôt qu’un cursus rigide : comment la formation ePlaneur mène de la découverte de Condor au vol en réseau, sur le modèle du vol réel.'
    le-club/activites/trello: 'Le tableau Trello du projet ePlaneur organise et suit les actions du club : campagnes d’adhésion, animations, sessions de vol et travaux sur le site.'
    le-club/adhesions/compte-yapla: 'Se connecter à son espace adhérent sur Yapla pour consulter sa fiche d’adhésion et l’historique de ses adhésions et de ses paiements au Club ePlaneur.'
    le-club/communication/communication-interne: 'WhatsApp en privé et des groupes thématiques que chacun choisit de rejoindre : comment les membres du Club ePlaneur échangent et se tiennent informés.'
    le-club/communication/lettre-enseignants: 'Une activité éducative gratuite pour les enseignants, avec ou sans préparation au BIA : piloter un planeur virtuel en huit étapes, du niveau scolaire à l’université.'
    le-club/communication/video-presentation: 'La vidéo de présentation du Club ePlaneur : apprendre à piloter un planeur sur le simulateur Condor depuis chez soi et voler avec d’autres passionnés.'
    le-club/listes-des-membres/bienfaiteurs: 'Les membres bienfaiteurs soutiennent le Club ePlaneur par un don. Ils ne votent pas aux assemblées générales mais contribuent à ses projets.'
    le-club/objectifs/brevet-eplaneur: 'Le Club propose à la Fédération Française de Vol en Planeur de créer un Brevet ePlaneur. Ce brevet n’existe pas encore : la page présente le projet.'
    voler: 'S’entraîner seul ou voler en réseau avec le club sur le simulateur Condor : participation, règles, préparation, enregistrement et analyse des vols.'
    voler/carnet-vols: 'Condor et le Condor Club tiennent chacun un carnet de vols : comment les distinguer, les renseigner et les gérer, comme le carnet d’un pilote de planeur.'
    voler/enregistrer-vol: 'Garder la trace de ses vols sur Condor pour les rejouer et les analyser : carnet de vols Condor, carnet et circuits du Condor Club, replays.'
    voler/mac-cready: 'Le réglage Mac Cready adapte la vitesse de transition aux ascendances attendues : polaire des vitesses, théorie de Paul MacCready et application sur Condor.'
    voler/outils-eplaneur: 'Les outils d’ePlaneur.fr pour retrouver un plan de vol (FPL), consulter les sessions de vol en réseau et leurs résultats, avec leur mode d’emploi.'
    voler/outils-eplaneur/afficher-fpl: 'Consulter le détail d’un plan de vol ePlaneur, télécharger son fichier .fpl pour Condor et .tsk pour XCSoar, et ouvrir son circuit sur le Condor Club.'
    voler/outils-eplaneur/rechercher-fpl: 'Trouver un plan de vol ePlaneur par version de Condor, type de vol, scène, planeur, aérodrome, distance ou difficulté.'
    voler/sites-indispensables: 'Club ePlaneur, ePlaneur.fr, Condor Club, Condor Soaring, utilitaires Condor : les sites à connaître pour pratiquer le vol en planeur virtuel.'
    voler/sites-indispensables/condor-club: 'Le Condor Club fournit scènes, circuits, enregistrement et analyse des vols, défis et compétitions en ligne. L’inscription est gratuite, l’abonnement Premium payant.'
    voler/sites-indispensables/condor-soaring: 'Le site officiel du simulateur Condor : achat du logiciel et des planeurs, licences, mises à jour, documentation, forums et serveurs de vol en réseau.'
    voler/sites-indispensables/utilitaires-condor: 'CondorUTill, de Marc Till, réunit des utilitaires pour analyser les vols, vérifier ses réglages et convertir les fichiers de Condor 2 et Condor 3.'
    voler/vols-reseau: 'Les vols en réseau du Club ePlaneur réunissent en ligne des pilotes de tous niveaux sur Condor, avec un circuit, une météo et des règles communs.'
    voler/vols-reseau/organisation: 'Initiation, Standard et Compétition : les trois niveaux des vols en réseau du Club ePlaneur, organisés toute l’année pour que chacun progresse à son rythme.'
    voler/vols-reseau/outils-vols: 'WhatsApp, Discord, fiches FPL et Condor Club : les outils pour annoncer, préparer, suivre et enregistrer les vols en réseau du Club ePlaneur.'
    voler/vols-reseau/participer: 'Rejoindre un vol en réseau pas à pas : communication sur Discord, connexion au serveur Condor et déroulement de la session jusqu’au départ du circuit.'
    voler/vols-reseau/pause-estivale: 'Pendant l’été, le Club réduit ses vols en réseau et la création de circuits, mais maintient un service minimum.'
    voler/vols-reseau/prerequis: 'Versions de Condor, scènes et hangar identiques à celles du serveur : ce qu’il faut vérifier avant de rejoindre un vol en réseau.'
    voler/vols-reseau/proposer-vol: 'Tout membre peut proposer un vol en réseau : les conditions à remplir, la préparation de la session et le rôle de l’organisateur pendant le vol.'
    voler/vols-reseau/regles: 'Ballastage, spirale à gauche, vitesse au départ, priorités et vol en local : les règles des vols en réseau du Club ePlaneur, inspirées du vol réel.'
    voler/vols-reseau/whatsapp-vols: 'Les groupes WhatsApp des vols annoncent date, heure, plan de vol et circuit Condor Club de chaque session, puis en publient les résultats.'
