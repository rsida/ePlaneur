framework:
    rate_limiter:
        # Pages that send an e-mail on request (new confirmation link): limits mailbox flooding
        account_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # Contact form: a few messages per visitor, so that a robot cannot flood the club's mailbox
        contact:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Messages between members: enough for a conversation, not for spamming every member
        message:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
